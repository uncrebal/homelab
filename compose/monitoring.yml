# Prometheus, Grafana und Exporter. PVE_TOKEN_VALUE als Umgebungsvariable setzen (z. B. in Portainer).
services:
  prometheus:
    image: prom/prometheus
    ports: ["9091:9090"]
    volumes: ["prometheus_data:/prometheus"]
    configs:
      - source: prom_config
        target: /etc/prometheus/prometheus.yml
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter
    pid: host
    volumes: ["/:/host:ro,rslave"]
    command: ["--path.rootfs=/host"]
    restart: unless-stopped

  pve-exporter:
    image: prompve/prometheus-pve-exporter
    environment:
      PVE_USER: "prometheus@pve"
      PVE_TOKEN_NAME: "exporter"
      PVE_TOKEN_VALUE: "${PVE_TOKEN_VALUE}"
      PVE_VERIFY_SSL: "false"   # Proxmox nutzt hier ein selbstsigniertes Zertifikat
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    volumes: ["grafana_data:/var/lib/grafana"]
    restart: unless-stopped

configs:
  prom_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["prometheus:9090"]
        - job_name: docker-vm
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: proxmox
          static_configs:
            - targets: ["10.0.10.10:9100"]
        - job_name: smart
          static_configs:
            - targets: ["10.0.10.10:9633"]
        - job_name: pve
          metrics_path: /pve
          params:
            module: [default]
            cluster: ["1"]
            node: ["1"]
          static_configs:
            - targets: ["10.0.10.10"]
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: pve-exporter:9221

volumes:
  prometheus_data:
  grafana_data:
